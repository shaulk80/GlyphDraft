name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    # The Android release key (decision 0002). Only release runs and manual runs use it; see build-android.
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

# github.workflow is the caller's name when this file is reused by release.yml, so the
# "ci-" prefix keeps this group different from the caller's group (same group = deadlock).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  build-windows:
    name: build-windows
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache the models of the fixture tests
        uses: actions/cache@v6
        with:
          path: engine/build/test-models
          key: test-models-${{ hashFiles('engine/src/jvmAndAndroidMain/kotlin/com/glyphdraft/engine/models/ModelManifest.kt') }}
      - name: Build, test, package, smoke test
        shell: pwsh
        run: ./scripts/build.ps1 -Target windows
      - name: Upload package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-windows
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1 libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            libfontconfig1 fonts-dejavu-core libfreetype6 binutils
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache the models of the fixture tests
        uses: actions/cache@v6
        with:
          path: engine/build/test-models
          key: test-models-${{ hashFiles('engine/src/jvmAndAndroidMain/kotlin/com/glyphdraft/engine/models/ModelManifest.kt') }}
      - name: Build, test, package, smoke test
        shell: pwsh
        run: ./scripts/build.ps1 -Target linux
      - name: Upload package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-linux
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  build-android:
    name: build-android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # Release runs (v* tag) and manual runs (the release dry run) sign with the release key and fail without it, so a
      # debug-signed APK can never be released. Pushes and pull requests keep the debug key (androidApp/build.gradle.kts).
      - name: Prepare the release key
        id: key
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::The Android release key is missing: set the secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (docs/release-signing.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/glyphdraft-release.jks"
          {
            echo "GLYPHDRAFT_KEYSTORE_FILE=$RUNNER_TEMP/glyphdraft-release.jks"
            echo "GLYPHDRAFT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GLYPHDRAFT_KEY_ALIAS=$KEY_ALIAS"
            echo "GLYPHDRAFT_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build, test, package
        shell: pwsh
        run: ./scripts/build.ps1 -Target android
      - name: Check the APK signature
        if: steps.key.outcome == 'success'
        shell: bash
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs dist/*.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key."
            exit 1
          fi
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test the APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: bash scripts/smoke-android.sh
      - name: Upload package
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: package-android
          path: dist/*
          retention-days: 14
          if-no-files-found: error
