# The single place for the app version (read by scripts/build.ps1 and release.yml).
appVersion=0.2.0

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# A repository that answers 429 or 5xx, or times out, is asked six times (waits of 1, 2, 4, 8 and 16 s) instead of
# three times (1 and 2 s) before Gradle gives up on it. An internal Gradle property: check it after a Gradle upgrade.
systemProp.org.gradle.internal.repository.max.tentatives=6
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
